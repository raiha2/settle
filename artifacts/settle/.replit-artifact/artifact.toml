kind = "web"
previewPath = "/"
title = "SETTLE"
description = "A friendly browser-only group bill calculator that turns shared payments into a short, clear list of who pays whom and how much."
version = "1.0.0"
id = "artifacts/settle"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18674

[services.development]
run = "pnpm --filter @workspace/settle run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/settle", "run", "build" ]
serve = "static"
publicDir = "artifacts/settle/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18674"
BASE_PATH = "/"
